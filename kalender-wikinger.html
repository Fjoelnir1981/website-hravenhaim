<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wikinger-Kalender</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=IM+Fell+English&display=swap">
    <style>
        :root {
            --night: #16110d;
            --wood: #2b1e14;
            --wood2: #3a2818;
            --iron: #6b7378;
            --bone: #eadfc6;
            --mute: #a99a7c;
            --ember: #d9541e;
            --gold: #c9a14a;
            --shield: #8f2a1c;
            --sea: #2f4858;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            padding: 1rem;
            background: var(--night);
            color: var(--bone);
            font: 17px/1.4 "IM Fell English", Georgia, serif
        }

        .cal {
            max-width: 440px;
            margin: 1rem auto;
            padding: 1.1rem 1.1rem 1rem;
            border-radius: 10px;
            background:
                repeating-linear-gradient(92deg, rgba(0, 0, 0, .14) 0 2px, transparent 2px 9px),
                linear-gradient(160deg, var(--wood2), var(--wood));
            border: 3px solid var(--iron);
            box-shadow: inset 0 0 0 3px var(--night), inset 0 0 0 5px var(--gold), 0 12px 30px rgba(0, 0, 0, .6);
        }

        .band {
            text-align: center;
            color: var(--gold);
            opacity: .7;
            letter-spacing: .35em;
            font-size: .8rem;
            white-space: nowrap;
            overflow: hidden;
            font-family: "Noto Sans Runic", "Segoe UI Historic", "Segoe UI Symbol", serif
        }

        .head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .5rem;
            margin: .7rem 0 .8rem
        }

        h2 {
            margin: 0;
            font: 400 1.55rem/1.1 "Uncial Antiqua", "IM Fell English", Georgia, serif;
            color: var(--bone);
            text-shadow: 0 2px 0 #000
        }

        .btns {
            display: flex;
            gap: .3rem
        }

        button {
            font: inherit;
            color: var(--bone);
            cursor: pointer
        }

        .btns button {
            background: linear-gradient(var(--sea), #22343f);
            border: 2px solid var(--iron);
            border-radius: 50%;
            min-width: 2.2rem;
            height: 2.2rem;
            padding: 0 .5rem;
            font-size: 1.1rem;
            line-height: 1
        }

        .btns #now {
            border-radius: 1.2rem;
            font-size: .95rem
        }

        .btns button:hover {
            border-color: var(--gold)
        }

        button:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 2px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            text-align: center;
            background: rgba(0, 0, 0, .3);
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #000
        }

        .wd {
            padding: .2rem 0 .35rem;
            color: var(--gold);
            font-size: .95rem;
            line-height: 1.1
        }

        .wd i {
            display: block;
            font-style: normal;
            font-size: .7rem;
            opacity: .7;
            font-family: "Noto Sans Runic", "Segoe UI Historic", "Segoe UI Symbol", serif
        }

        .day {
            position: relative;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            background: rgba(234, 223, 198, .05);
            border: 1px solid rgba(234, 223, 198, .08);
            border-radius: 4px;
            font-size: 1rem
        }

        .day:hover {
            border-color: var(--gold)
        }

        .day.out {
            opacity: .3
        }

        .day.we {
            color: var(--mute)
        }

        .day.sel {
            border-color: var(--gold);
            box-shadow: inset 0 0 0 1px var(--gold)
        }

        .day.today {
            color: #fff;
            font-weight: 700;
            border-radius: 50%;
            border: 2px solid var(--iron);
            background: radial-gradient(circle at 50% 50%, var(--iron) 0 16%, transparent 17%),
                conic-gradient(var(--shield) 0 25%, #e0c98a 0 50%, var(--shield) 0 75%, #e0c98a 0);
            text-shadow: 0 1px 2px #000, 0 0 4px #000
        }

        .day.today.sel {
            box-shadow: 0 0 0 2px var(--gold)
        }

        .day.has::after {
            content: "ᛟ";
            position: absolute;
            bottom: 1px;
            right: 4px;
            font-size: .7rem;
            color: var(--ember);
            font-family: "Noto Sans Runic", "Segoe UI Historic", "Segoe UI Symbol", serif
        }

        .list {
            margin: .9rem 0 .7rem;
            padding: .7rem .8rem;
            min-height: 4rem;
            background: rgba(0, 0, 0, .3);
            border-left: 4px solid var(--ember);
            border-radius: 0 6px 6px 0
        }

        .list h3 {
            margin: 0 0 .3rem;
            font: 400 1.05rem "Uncial Antiqua", "IM Fell English", serif;
            color: var(--gold)
        }

        .list p {
            margin: .15rem 0;
            color: var(--mute);
            font-style: italic
        }

        .list .e {
            margin: .15rem 0
        }

        .list .e b {
            color: var(--ember)
        }

        @media (max-width:380px) {
            h2 {
                font-size: 1.25rem
            }

            .band {
                letter-spacing: .2em
            }
        }
    </style>
</head>

<body>
    <section class="cal" aria-label="Kalender">
        <div class="band" aria-hidden="true">ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ</div>
        <div class="head">
            <h2 id="title" aria-live="polite"></h2>
            <div class="btns">
                <button id="prev" aria-label="Vorheriger Monat">‹</button>
                <button id="now">Heute</button>
                <button id="next" aria-label="Nächster Monat">›</button>
            </div>
        </div>
        <div class="grid" id="grid"></div>
        <div class="list" id="list"></div>
        <div class="band" aria-hidden="true">ᛟᛞᛜᛚᛗᛖᛒᛏᛊᛉᛈᛇᛃᛁᚾᚺᚹᚷᚲᚱᚨᚦᚢᚠ</div>
    </section>

    <script>
        /* ===== Hier eigene Termine eintragen: Datum "JJJJ-MM-TT" ===== */
        const TERMINE = [
            { datum: "2026-10-04", titel: "LeitungsThing der Führungskräfte" },
            { datum: "2026-10-15", titel: "Thing – Versammlung der Sippe", zeit: "18:00" },
            { datum: "2026-12-19", titel: "Julfest (Wintersonnenwende)" }
        ];
        /* ================================================================ */

        const MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
        const TAGE = [["Mo", "ᛚ"], ["Di", "ᛏ"], ["Mi", "ᚨ"], ["Do", "ᚦ"], ["Fr", "ᚠ"], ["Sa", "ᛃ"], ["So", "ᛊ"]];
        const $ = id => document.getElementById(id);
        const key = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

        let today = new Date();
        let view = new Date(today.getFullYear(), today.getMonth(), 1);
        let selected = key(today);

        function render() {
            $("title").textContent = `${MONATE[view.getMonth()]} ${view.getFullYear()}`;
            const g = $("grid");
            g.innerHTML = TAGE.map(([t, r]) => `<div class="wd">${t}<i aria-hidden="true">${r}</i></div>`).join("");
            const offset = (view.getDay() + 6) % 7;
            const start = new Date(view.getFullYear(), view.getMonth(), 1 - offset);
            const todayKey = key(today);
            for (let i = 0; i < 42; i++) {
                const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
                if (i >= 35 && d.getMonth() !== view.getMonth()) break;
                const k = key(d), cls = ["day"];
                if (d.getMonth() !== view.getMonth()) cls.push("out");
                if (d.getDay() === 0 || d.getDay() === 6) cls.push("we");
                if (k === todayKey) cls.push("today");
                if (k === selected) cls.push("sel");
                if (TERMINE.some(t => t.datum === k)) cls.push("has");
                const b = document.createElement("button");
                b.className = cls.join(" ");
                b.textContent = d.getDate();
                b.setAttribute("aria-label", `${d.getDate()}. ${MONATE[d.getMonth()]} ${d.getFullYear()}`);
                if (k === todayKey) b.setAttribute("aria-current", "date");
                b.onclick = () => { selected = k; if (d.getMonth() !== view.getMonth()) view = new Date(d.getFullYear(), d.getMonth(), 1); render(); };
                g.appendChild(b);
            }
            const [y, m, dd] = selected.split("-").map(Number);
            const ev = TERMINE.filter(t => t.datum === selected);
            $("list").innerHTML = `<h3>${dd}. ${MONATE[m - 1]} ${y}</h3>` +
                (ev.length ? ev.map(e => `<div class="e">${e.zeit ? `<b>${e.zeit}</b> ` : ""}${e.titel}</div>`).join("") : `<p>Keine Termine an diesem Tag.</p>`);
        }

        $("prev").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); };
        $("next").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); };
        $("now").onclick = () => { today = new Date(); view = new Date(today.getFullYear(), today.getMonth(), 1); selected = key(today); render(); };

        /* Aktualisiert sich automatisch: prüft jede Minute, ob ein neuer Tag begonnen hat */
        setInterval(() => {
            const n = new Date();
            if (key(n) !== key(today)) {
                const followToday = selected === key(today);
                today = n;
                if (followToday) { selected = key(n); view = new Date(n.getFullYear(), n.getMonth(), 1); }
                render();
            }
        }, 60000);

        render();
    </script>
</body>

</html>
